services:
  postgres:
    image: postgres:16-alpine
    container_name: codenova-postgres
    restart: always
    environment:
      POSTGRES_USER: codenova_user
      POSTGRES_PASSWORD: codenova_dev_password
      POSTGRES_DB: codenova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codenova_user -d codenova_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codenova-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-pipeline:
    build:
      context: ./ai-ml/pipeline_service
    container_name: codenova-ml-pipeline
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
